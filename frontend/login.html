<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e4572e" />
  <title>Entrar · EducaPrime</title>
  <meta name="description" content="Acesse sua conta EducaPrime para comprar e baixar seus materiais." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E4572E'/%3E%3Cpath d='M22 18h22v6H28v8h13v6H28v8h16v6H22z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page page-auth">
    <div class="auth-card">
      <h1>Entrar</h1>
      <p class="auth-sub">Bem-vindo de volta. Acesse sua conta para comprar e baixar seus materiais.</p>
      <form id="form-login" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required />
        </div>
        <p id="form-erro" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg"><span class="btn-text">Entrar</span></button>
      </form>
      <form id="form-codigo" novalidate hidden>
        <p id="codigo-info" class="auth-sub"></p>
        <div class="field">
          <label for="codigo">Código de verificação</label>
          <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required />
        </div>
        <p id="codigo-erro" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg"><span class="btn-text">Confirmar</span></button>
        <p class="auth-alt"><a href="#" id="reenviar">Reenviar código</a> · <a href="/login">Voltar</a></p>
      </form>
      <p class="auth-alt" id="alt-cadastro">Ainda não tem conta? <a href="/cadastro">Cadastre-se grátis</a></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/src/js/login.js"></script>
</body>
</html>
